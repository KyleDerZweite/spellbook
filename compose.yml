# Standalone self-hosting. No .env, tunnel or provider credentials required.
services:
  postgres:
    image: docker.io/postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-spellbook}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-spellbook}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${LOCAL_POSTGRES_USER:-spellbook} -d ${LOCAL_POSTGRES_DB:-spellbook}
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  db-migrate:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    command: ['/app/backend/api/.venv/bin/spellbook-migrate']
    environment:
      DATABASE_URL: postgres://${LOCAL_POSTGRES_USER:-spellbook}:@postgres:5432/${LOCAL_POSTGRES_DB:-spellbook}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  worker:
    build:
      context: ./backend/workers/catalog
    profiles: [catalog]
    environment:
      DATABASE_URL: postgres://${LOCAL_POSTGRES_USER:-spellbook}:@postgres:5432/${LOCAL_POSTGRES_DB:-spellbook}
      CATALOG_SOURCE: all_cards
      SYNC_INTERVAL: manual
      WORKER_DATA_DIR: /app/data
    volumes:
      - worker_data:/app/data
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: 'no'
  scan-worker:
    build:
      context: ./backend/workers/scan
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    network_mode: service:frontend
    environment:
      API_HOST: 127.0.0.1
      API_PORT: 3001
      API_TRUSTED_PROXY_ADDRESSES: 127.0.0.1,::1
      APP_ORIGIN: ${LOCAL_APP_ORIGIN:-http://localhost:3000}
      DEMO_MODE: 'false'
      VALUE_HISTORY_TIMEZONE: ${LOCAL_VALUE_HISTORY_TIMEZONE:-Europe/Berlin}
      DATABASE_URL: postgres://${LOCAL_POSTGRES_USER:-spellbook}:@postgres:5432/${LOCAL_POSTGRES_DB:-spellbook}
      SCAN_WORKER_URL: http://scan-worker:8080
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      scan-worker:
        condition: service_started
    restart: unless-stopped
  state-worker:
    build:
      context: .
      dockerfile: backend/workers/state/Dockerfile
    environment:
      DEMO_MODE: 'false'
      DATABASE_URL: postgres://${LOCAL_POSTGRES_USER:-spellbook}:@postgres:5432/${LOCAL_POSTGRES_DB:-spellbook}
      VALUE_HISTORY_ENABLED: ${LOCAL_VALUE_HISTORY_ENABLED:-true}
      VALUE_HISTORY_TIMEZONE: ${LOCAL_VALUE_HISTORY_TIMEZONE:-Europe/Berlin}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  frontend:
    ports:
      - '127.0.0.1:${LOCAL_PORT:-3000}:3000'
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_ORIGIN: ${LOCAL_APP_ORIGIN:-http://localhost:3000}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${LOCAL_APP_ORIGIN:-http://localhost:3000}
      DEMO_MODE: 'false'
      API_INTERNAL_URL: http://127.0.0.1:3001
      ADDRESS_HEADER: ${LOCAL_ADDRESS_HEADER:-}
      XFF_DEPTH: ${LOCAL_XFF_DEPTH:-1}
      BODY_SIZE_LIMIT: ${LOCAL_BODY_SIZE_LIMIT:-12M}
    restart: unless-stopped

volumes:
  postgres18_data: null
  worker_data: null
