[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "spellbook-state-worker"
version = "0.1.0"
requires-python = "==3.14.8"
dependencies = ["spellbook-core==0.1.0", "psycopg-pool==3.3.3"]

[project.scripts]
spellbook-state-worker = "spellbook_state.main:main"

[project.optional-dependencies]
dev = ["mypy==2.4.0", "pytest==9.1.1", "ruff==0.17.1"]

[tool.uv]
required-version = ">=0.12.23,<0.14"

[tool.uv.sources]
spellbook-core = { path = "../../core" }

[tool.hatch.build.targets.wheel]
packages = ["src/spellbook_state"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
