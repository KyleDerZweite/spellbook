# Stable server connector shared by Demo and the optional production stack.
services:
  newt:
    image: docker.io/fosrl/newt:1.18.1
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PANGOLIN_ENDPOINT: ${PROD_PANGOLIN_ENDPOINT:?Set the Pangolin endpoint}
      NEWT_ID: ${PROD_NEWT_ID:?Set the site connector ID}
      NEWT_SECRET: ${PROD_NEWT_SECRET:?Set the site connector secret}
    networks:
      - ingress
networks:
  ingress:
    name: ${PROD_INGRESS_NETWORK:?Set the shared server ingress network}
