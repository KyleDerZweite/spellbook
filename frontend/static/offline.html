<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#101010" />
		<meta name="robots" content="noindex" />
		<title>Offline | Spellbook</title>
		<style>
			:root {
				color-scheme: dark light;
				font-family: system-ui, sans-serif;
				background: #101010;
				color: #eee;
			}
			body {
				margin: 0;
				min-height: 100svh;
				display: grid;
				place-items: center;
			}
			main {
				max-width: 32rem;
				padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
					max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
			}
			img {
				width: 64px;
				height: 64px;
			}
			p {
				line-height: 1.6;
			}
			a {
				display: inline-flex;
				align-items: center;
				min-height: 44px;
				color: #e5c88b;
			}
			a:focus-visible {
				outline: 2px solid currentColor;
				outline-offset: 4px;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icon-192.png" alt="" width="64" height="64" />
			<h1>Spellbook is offline</h1>
			<p>
				This page could not connect to Spellbook. Check your connection, then reload the page you
				were opening.
			</p>
			<p>
				Account data, sign-in and scanning need an internet connection. This offline page contains
				no account data and cannot save changes.
			</p>
			<p><a href="">Retry this page</a></p>
			<p><a href="/app">Open the app hub</a></p>
		</main>
	</body>
</html>
