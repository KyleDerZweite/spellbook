version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
      timezone: 'UTC'
    open-pull-requests-limit: 8
    groups:
      frontend-non-major:
        dependency-type: production
        update-types:
          - minor
          - patch
      frontend-dev-non-major:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Supported updater tools: docs/operations/github-automation.md#dependabot
  - package-ecosystem: uv
    directories:
      - '/backend/core'
      - '/backend/api'
      - '/backend/workers/state'
      - '/backend/workers/catalog'
      - '/backend/workers/scan'
    schedule:
      interval: weekly
      day: monday
      time: '05:45'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    groups:
      python-dev-patch:
        dependency-type: development
        update-types:
          - patch
      python-prod-patch:
        dependency-type: production
        update-types:
          - patch
