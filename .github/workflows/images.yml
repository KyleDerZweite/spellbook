name: Images

# Builds hosted images once in CI after green main CI and publishes the environment-independent
# ones to GHCR as sha-<full commit>. Version tags create a GitHub (pre)release for an already
# published commit. The host updater keeps building locally until it consumes these images.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Build ${{ matrix.name }}
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., file: backend/api/Dockerfile, push: true }
          - { name: state-worker, context: ., file: backend/workers/state/Dockerfile, push: true }
          - {
              name: worker,
              context: backend/workers/catalog,
              file: backend/workers/catalog/Dockerfile,
              push: true
            }
          - {
              name: scan-worker,
              context: backend/workers/scan,
              file: backend/workers/scan/Dockerfile,
              push: true
            }
          # The web build embeds its public Origin, so it is verified here but not yet published.
          - { name: frontend, context: ., file: frontend/Dockerfile, push: false }
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE: ghcr.io/kylederzweite/spellbook-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Build
        run: >-
          docker build --file "${{ matrix.file }}" --tag "$IMAGE:sha-$SHA"
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision="$SHA"
          "${{ matrix.context }}"
      - name: Publish
        if: matrix.push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:sha-$SHA"

  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Require published images for the tagged commit
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for name in api state-worker worker scan-worker; do
            docker manifest inspect "ghcr.io/kylederzweite/spellbook-$name:sha-$GITHUB_SHA" > /dev/null
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes "${prerelease[@]}"
