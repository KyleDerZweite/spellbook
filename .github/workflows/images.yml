name: Images

# Version tags publish hosted images to GHCR as sha-<full commit> and <tag> once the tagged commit's
# newest main push CI run succeeded, then create a GitHub (pre)release and move `release`. Podman
# auto-update follows the moving tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Require green main CI
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Validate version tag and require no existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9A-Za-z._-]{1,127}$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must match ^v[0-9A-Za-z._-]{1,127}$ (Docker-safe tag, no '+')"
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          case "$code" in
            404) ;;
            200) echo "::error::GitHub release '$GITHUB_REF_NAME' already exists"; exit 1 ;;
            *) echo "::error::GitHub API answered $code checking release '$GITHUB_REF_NAME'"; exit 1 ;;
          esac
      - name: Require the tagged commit's newest main push CI run to have succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The list is newest first and reports each run's latest attempt, so an older green run
          # cannot hide a newer failed, cancelled or pending one.
          result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1" \
            --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')"
          if [[ "$result" != 'completed success' ]]; then
            echo "::error::Newest main push CI for $GITHUB_SHA is '${result:-missing}', not 'completed success'"
            exit 1
          fi

  publish:
    name: Build ${{ matrix.name }}
    needs: verify
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., file: backend/api/Dockerfile, push: true }
          - { name: state-worker, context: ., file: backend/workers/state/Dockerfile, push: true }
          - {
              name: worker,
              context: backend/workers/catalog,
              file: backend/workers/catalog/Dockerfile,
              push: true
            }
          - {
              name: scan-worker,
              context: backend/workers/scan,
              file: backend/workers/scan/Dockerfile,
              push: true
            }
          # Built without APP_ORIGIN: the web server derives its Origin from the request Host.
          - { name: frontend, context: ., file: frontend/Dockerfile, push: true }
    env:
      SHA: ${{ github.sha }}
      IMAGE: ghcr.io/kylederzweite/spellbook-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: >-
          docker build --file "${{ matrix.file }}" --tag "$IMAGE:$GITHUB_REF_NAME"
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision="$SHA"
          "${{ matrix.context }}"
      - name: Publish
        if: matrix.push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_REF_NAME"

  release:
    name: Release
    needs: publish
    timeout-minutes: 10
    runs-on: ubuntu-latest
    concurrency:
      group: images-promote-release
      queue: max
    permissions:
      contents: write
      packages: write
    steps:
      # Every version-tagged image is checked before the release exists, and both `sha-<commit>`
      # and `release` move from `$GITHUB_REF_NAME` only after the release is created, so concurrent
      # tags on the same commit cannot mix digests and failures leave `release` untouched.
      - name: Require published images for the release tag
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for name in api state-worker worker scan-worker frontend; do
            docker manifest inspect "ghcr.io/kylederzweite/spellbook-$name:$GITHUB_REF_NAME" > /dev/null
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes "${prerelease[@]}"
      - name: Point release at the tagged images
        run: |
          for name in api state-worker worker scan-worker frontend; do
            image="ghcr.io/kylederzweite/spellbook-$name"
            docker buildx imagetools create --tag "$image:sha-$GITHUB_SHA" --tag "$image:release" "$image:$GITHUB_REF_NAME"
          done
