name: Application Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-integration:
    name: Application Integration
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: spellbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spellbook_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/spellbook_test
      TEST_SCAN_DATABASE_NAME: spellbook_test
      SCAN_WORKER_URL: http://127.0.0.1:5227
      SCAN_STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: true
      - name: Install API, Core and independent workers
        run: pnpm --dir .. setup:python
      - name: System ICU for Core Combo ordering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev
      - name: Start the actual Scan worker scaffold
        run: |
          printf 'SCAN_LOCAL_STORAGE_DIR=%s/scan-artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          uv run --project ../backend/workers/scan --no-sync uvicorn scan_worker.main:app --host 127.0.0.1 --port 5227 > ../.scan-worker-test.log 2>&1 &
          echo "$!" > ../.scan-worker-test.pid
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:5227/health > /dev/null; then exit 0; fi
            sleep 0.2
          done
          exit 1
      - run: pnpm db:migrate
      - run: pnpm --dir .. build
        env:
          APP_ORIGIN: http://127.0.0.1:5191
      - name: Python Category and Deck PostgreSQL consumers
        working-directory: backend/api
        env:
          CATEGORY_NATIVE_DATABASE: spellbook_test
          CATEGORY_JOB_NATIVE_DATABASE: spellbook_test
          DECK_NATIVE_DATABASE: spellbook_test
        run: .venv/bin/python -m pytest ../core/tests/test_categories_postgres.py ../core/tests/test_categories_jobs_postgres.py ../core/tests/test_decks_postgres.py
      - run: pnpm test:http
      - run: pnpm test:scan
      - run: pnpm test:sync
      - name: Stop the owned Scan worker
        if: always()
        run: |
          if test -f ../.scan-worker-test.pid; then kill "$(cat ../.scan-worker-test.pid)"; fi
