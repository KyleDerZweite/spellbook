name: Dependabot Auto Merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  check_suite:
    types:
      - completed
  check_run:
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# CI checks that MUST be green before any Dependabot PR can auto-merge.
# Keep this in sync with the job names declared in ci.yml.
env:
  REQUIRED_CHECK_NAMES: |
    Frontend Lint & Unit Tests
    Frontend Build
    Frontend DB Schema Check
    Worker Tests
    Scan Worker Tests
    Frontend Integration Tests

jobs:
  merge:
    name: Merge eligible Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch' || github.event_name == 'check_suite' || github.event_name == 'check_run'
    steps:
      - name: Merge clean Dependabot PRs
        uses: actions/github-script@v9
        env:
          REQUIRED_CHECK_NAMES: ${{ env.REQUIRED_CHECK_NAMES }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository.default_branch;

            const requiredChecks = (process.env.REQUIRED_CHECK_NAMES || "")
              .split("\n")
              .map((name) => name.trim())
              .filter(Boolean);

            if (requiredChecks.length === 0) {
              core.setFailed("REQUIRED_CHECK_NAMES is empty; refusing to merge with no gating checks.");
              return;
            }

            // Trust ONLY pr.user.login. The pr.head.ref naming convention is
            // not a trust boundary — anyone can name a branch dependabot/...
            function isDependabotPullRequest(pr) {
              return pr?.user?.login === "dependabot[bot]";
            }

            function targetsDefaultBranch(pr) {
              return pr?.base?.ref === defaultBranch;
            }

            async function listCandidatePullRequests() {
              switch (context.eventName) {
                case "pull_request":
                  return [context.payload.pull_request];
                case "check_suite":
                  return context.payload.check_suite.pull_requests || [];
                case "check_run":
                  return context.payload.check_run.pull_requests || [];
                case "workflow_dispatch": {
                  const { data } = await github.rest.pulls.list({
                    owner,
                    repo,
                    state: "open",
                    per_page: 100,
                  });
                  return data;
                }
                default:
                  return [];
              }
            }

            function missingRequiredChecks(checkRuns) {
              const successful = new Set(
                checkRuns
                  .filter(
                    (run) =>
                      run.status === "completed" &&
                      ["success", "neutral", "skipped"].includes(run.conclusion)
                  )
                  .map((run) => run.name)
              );
              return requiredChecks.filter((name) => !successful.has(name));
            }

            async function mergePullRequest(pr) {
              const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
              const mergeMethods = [
                repoInfo.allow_squash_merge ? "squash" : null,
                repoInfo.allow_rebase_merge ? "rebase" : null,
                repoInfo.allow_merge_commit ? "merge" : null,
              ].filter(Boolean);

              for (const merge_method of mergeMethods) {
                try {
                  await github.rest.pulls.merge({
                    owner,
                    repo,
                    pull_number: pr.number,
                    sha: pr.head.sha,
                    merge_method,
                  });
                  core.info(`Merged PR #${pr.number} with ${merge_method}.`);
                  return true;
                } catch (error) {
                  core.info(
                    `Merge attempt for PR #${pr.number} with ${merge_method} failed: ${error.message}`,
                  );
                }
              }

              return false;
            }

            async function waitForMergeability(pullNumber) {
              for (let attempt = 0; attempt < 6; attempt += 1) {
                const { data: pr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pullNumber,
                });

                if (pr.mergeable !== null && pr.mergeable_state !== "unknown") {
                  return pr;
                }

                await new Promise((resolve) => setTimeout(resolve, 5000));
              }

              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });

              return pr;
            }

            const candidates = (await listCandidatePullRequests()).filter(
              (pr) => isDependabotPullRequest(pr) && targetsDefaultBranch(pr),
            );

            if (candidates.length === 0) {
              core.info("No matching Dependabot PRs found.");
              return;
            }

            for (const candidate of candidates) {
              const pr = await waitForMergeability(candidate.number);

              if (pr.state !== "open" || pr.draft) {
                core.info(`Skipping PR #${pr.number}: not open and ready.`);
                continue;
              }

              if (!isDependabotPullRequest(pr) || !targetsDefaultBranch(pr)) {
                core.info(`Skipping PR #${pr.number}: no longer matches filters.`);
                continue;
              }

              if (pr.mergeable === false || pr.mergeable_state === "dirty") {
                core.info(`Skipping PR #${pr.number}: merge conflicts detected.`);
                continue;
              }

              if (pr.mergeable === null || pr.mergeable_state === "unknown") {
                core.info(`Skipping PR #${pr.number}: mergeability did not resolve in time.`);
                continue;
              }

              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha,
                filter: "latest",
                per_page: 100,
              });

              const missing = missingRequiredChecks(checkRuns.check_runs);
              if (missing.length > 0) {
                core.info(
                  `Skipping PR #${pr.number}: missing successful checks: ${missing.join(", ")}`,
                );
                continue;
              }

              await mergePullRequest(pr);
            }
