name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  changes:
    name: CI Scope
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.scope.outputs.application }}
      worker: ${{ steps.scope.outputs.worker }}
      scan_worker: ${{ steps.scope.outputs.scan_worker }}
      python_backend: ${{ steps.scope.outputs.python_backend }}
      state_worker: ${{ steps.scope.outputs.state_worker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - run: node scripts/ci-checks.mjs scope
      - name: Select affected suites
        id: scope
        run: node scripts/ci-changes.mjs
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  frontend-lint-unit:
    name: Application Checks
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pipx install podman-compose==1.6.0
      - run: node scripts/ci-checks.mjs application

  python-backend:
    name: Python API/Core
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.python_backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv python install 3.14.8
      - name: ICU for Core Combo witness ordering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev
      - run: node scripts/ci-checks.mjs python-backend
        env:
          CI_SCOPE: ${{ toJSON(needs.changes.outputs) }}

  worker-tests:
    name: Python Workers
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.worker == 'true' || needs.changes.outputs.scan_worker == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ needs.changes.outputs.worker == 'true' && 'postgres:18.6-bookworm' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: spellbook_worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/spellbook_worker_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv python install 3.14.8
      - run: node scripts/ci-checks.mjs workers
        env:
          CI_SCOPE: ${{ toJSON(needs.changes.outputs) }}

  # Images publishes only commits whose integration suites passed.
  application-integration:
    name: Application Integration
    if: github.event_name == 'push'
    uses: ./.github/workflows/application-integration.yml
