name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: CI Scope
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.scope.outputs.application }}
      android: ${{ steps.scope.outputs.android }}
      worker: ${{ steps.scope.outputs.worker }}
      scan_worker: ${{ steps.scope.outputs.scan_worker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - run: node --test scripts/ci-changes.test.mjs
      - name: Select affected suites
        id: scope
        run: node scripts/ci-changes.mjs
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  frontend-lint-unit:
    name: Application Checks
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm test:dev
      - run: pnpm --dir .. test:packaging
      - run: pnpm --dir ../backend test
      - run: pnpm db:check

  frontend-integration:
    name: Application Integration
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: spellbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spellbook_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/spellbook_test
      TEST_SCAN_DATABASE_NAME: spellbook_test
      SCAN_WORKER_URL: http://127.0.0.1:5227
      SCAN_STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --project ../scan-worker --frozen --extra dev --python 3.14.8
      - name: Start the actual Scan worker scaffold
        run: |
          printf 'SCAN_LOCAL_STORAGE_DIR=%s/scan-artifacts\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          uv run --project ../scan-worker --no-sync uvicorn scan_worker.main:app --host 127.0.0.1 --port 5227 > ../.scan-worker-test.log 2>&1 &
          echo "$!" > ../.scan-worker-test.pid
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:5227/health > /dev/null; then exit 0; fi
            sleep 0.2
          done
          exit 1
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm --dir .. build
        env:
          APP_ORIGIN: http://127.0.0.1:5191
      - run: pnpm test:http
      - run: pnpm test:scan
      - run: pnpm test:sync
      - name: Stop the owned Scan worker
        if: always()
        run: |
          if test -f ../.scan-worker-test.pid; then kill "$(cat ../.scan-worker-test.pid)"; fi

  worker-tests:
    name: Python Workers
    needs: changes
    if: needs.changes.outputs.worker == 'true' || needs.changes.outputs.scan_worker == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ needs.changes.outputs.worker == 'true' && 'postgres:18.6-bookworm' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: spellbook_worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/spellbook_worker_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv python install 3.14.8
      - name: Catalog worker checks
        if: needs.changes.outputs.worker == 'true'
        working-directory: worker
        run: |
          uv lock --check --python 3.14.8
          uv sync --frozen --extra dev --python 3.14.8
          uv run --no-sync ruff check
          uv run --no-sync ruff format --check
          uv run --no-sync pytest
      - name: Scan worker checks
        if: ${{ !cancelled() && needs.changes.outputs.scan_worker == 'true' }}
        working-directory: scan-worker
        run: |
          uv lock --check --python 3.14.8
          uv sync --frozen --extra dev --python 3.14.8
          uv run --no-sync ruff check
          uv run --no-sync ruff format --check
          uv run --no-sync pytest

  android-build:
    name: Android Build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the target Android SDK
        run: sdkmanager "platforms;android-37.0"
      - name: Native unit tests and debug artifact
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
