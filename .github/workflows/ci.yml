name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-lint-unit:
    name: Frontend Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  frontend-db-check:
    name: Frontend DB Schema Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check

  frontend-integration:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: spellbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spellbook_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/spellbook_test
      SCAN_WORKER_URL: http://127.0.0.1:5227
      SCAN_STORAGE_DRIVER: local
      SCAN_LOCAL_STORAGE_DIR: ${{ runner.temp }}/scan-artifacts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --project ../scan-worker --frozen --extra dev --python 3.14.8
      - name: Start the actual Scan worker scaffold
        run: |
          uv run --project ../scan-worker --no-sync uvicorn scan_worker.main:app --host 127.0.0.1 --port 5227 > ../.scan-worker-test.log 2>&1 &
          echo "$!" > ../.scan-worker-test.pid
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:5227/health > /dev/null; then exit 0; fi
            sleep 0.2
          done
          exit 1
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
        env:
          APP_ORIGIN: http://127.0.0.1:5191
      - run: pnpm test:http
      - run: pnpm test:scan
      - run: pnpm test:sync
      - name: Stop the owned Scan worker
        if: always()
        run: |
          if test -f ../.scan-worker-test.pid; then kill "$(cat ../.scan-worker-test.pid)"; fi

  worker-tests:
    name: Worker Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: spellbook_worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/spellbook_worker_test
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv python install 3.14.8
      - run: uv lock --check --python 3.14.8
      - run: uv sync --frozen --extra dev --python 3.14.8
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pytest

  scan-worker-tests:
    name: Scan Worker Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scan-worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv python install 3.14.8
      - run: uv lock --check --python 3.14.8
      - run: uv sync --frozen --extra dev --python 3.14.8
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pytest
