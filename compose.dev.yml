# Configured private Development. Use pnpm dev with the root .env.
services:
  postgres:
    image: docker.io/postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-spellbook_dev}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-spellbook}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?Set DEV_POSTGRES_PASSWORD for Development}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DEV_POSTGRES_USER:-spellbook} -d ${DEV_POSTGRES_DB:-spellbook_dev}
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  db-migrate:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    command: ['/app/backend/api/.venv/bin/spellbook-migrate']
    environment:
      DATABASE_URL: postgres://${DEV_POSTGRES_USER:-spellbook}:${DEV_POSTGRES_PASSWORD:?Set DEV_POSTGRES_PASSWORD for Development}@postgres:5432/${DEV_POSTGRES_DB:-spellbook_dev}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  worker:
    build:
      context: ./backend/workers/catalog
    profiles: [catalog]
    environment:
      DATABASE_URL: postgres://${DEV_POSTGRES_USER:-spellbook}:${DEV_POSTGRES_PASSWORD:?Set DEV_POSTGRES_PASSWORD for Development}@postgres:5432/${DEV_POSTGRES_DB:-spellbook_dev}
      CATALOG_SOURCE: all_cards
      SYNC_INTERVAL: manual
      WORKER_DATA_DIR: /app/data
    volumes:
      - worker_data:/app/data
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: 'no'
  scan-worker:
    build:
      context: ./backend/workers/scan
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    network_mode: service:frontend
    environment:
      API_HOST: 127.0.0.1
      API_PORT: 3001
      API_TRUSTED_PROXY_ADDRESSES: 127.0.0.1,::1
      APP_ORIGIN: ${DEV_APP_ORIGIN:?Set DEV_APP_ORIGIN for Development}
      DEMO_MODE: 'false'
      VALUE_HISTORY_TIMEZONE: ${DEV_VALUE_HISTORY_TIMEZONE:-Europe/Berlin}
      DATABASE_URL: postgres://${DEV_POSTGRES_USER:-spellbook}:${DEV_POSTGRES_PASSWORD:?Set DEV_POSTGRES_PASSWORD for Development}@postgres:5432/${DEV_POSTGRES_DB:-spellbook_dev}
      SCAN_WORKER_URL: http://scan-worker:8080
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      scan-worker:
        condition: service_started
    restart: unless-stopped
  state-worker:
    build:
      context: .
      dockerfile: backend/workers/state/Dockerfile
    environment:
      DEMO_MODE: 'false'
      DATABASE_URL: postgres://${DEV_POSTGRES_USER:-spellbook}:${DEV_POSTGRES_PASSWORD:?Set DEV_POSTGRES_PASSWORD for Development}@postgres:5432/${DEV_POSTGRES_DB:-spellbook_dev}
      VALUE_HISTORY_ENABLED: ${DEV_VALUE_HISTORY_ENABLED:-true}
      VALUE_HISTORY_TIMEZONE: ${DEV_VALUE_HISTORY_TIMEZONE:-Europe/Berlin}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_ORIGIN: ${DEV_APP_ORIGIN:?Set DEV_APP_ORIGIN for Development}
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${DEV_APP_ORIGIN:?Set DEV_APP_ORIGIN for Development}
      DEMO_MODE: 'false'
      API_INTERNAL_URL: http://127.0.0.1:3001
      ADDRESS_HEADER: ${DEV_ADDRESS_HEADER:-}
      XFF_DEPTH: ${DEV_XFF_DEPTH:-1}
      BODY_SIZE_LIMIT: ${DEV_BODY_SIZE_LIMIT:-12M}
    restart: unless-stopped

  newt:
    image: docker.io/fosrl/newt:1.18.1
    restart: unless-stopped
    environment:
      PANGOLIN_ENDPOINT: ${DEV_PANGOLIN_ENDPOINT:?Set DEV_PANGOLIN_ENDPOINT for Development}
      NEWT_ID: ${DEV_NEWT_ID:?Set DEV_NEWT_ID for Development}
      NEWT_SECRET: ${DEV_NEWT_SECRET:?Set DEV_NEWT_SECRET for Development}
    depends_on:
      - frontend

volumes:
  postgres18_data: null
  worker_data: null
