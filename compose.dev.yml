# Use a distinct Compose project name and database for disposable Demo data.
services:
  postgres:
    image: docker.io/postgres:18.6-bookworm
    environment:
      POSTGRES_DB: spellbook_demo
      POSTGRES_USER: spellbook
      POSTGRES_PASSWORD: demo
    volumes:
      - demo_postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U spellbook -d spellbook_demo']
      interval: 5s
      timeout: 5s
      retries: 12

  prepare:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: api
    command: [sh, -c, 'spellbook-migrate && spellbook-demo-seed']
    environment:
      DATABASE_URL: postgres://spellbook:demo@postgres:5432/spellbook_demo
    depends_on:
      postgres:
        condition: service_healthy

  scan-worker:
    build:
      context: ./backend/workers/scan
    environment:
      SCAN_STORAGE_DRIVER: local
      SCAN_LOCAL_STORAGE_DIR: /app/storage/scans
      PYTHONPATH: /app/src
    command: [uv, run, --no-sync, uvicorn, 'scan_worker.main:app', --host, 0.0.0.0, --port, '8080', --reload]
    volumes:
      - demo_scans:/app/storage/scans
      - ./backend/workers/scan/src:/app/src:z

  state-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: state
    command: [watchfiles, '--filter', python, spellbook-state-worker, /app/backend/workers/state/src, /app/backend/core/src]
    environment:
      DEMO_MODE: 'true'
      DATABASE_URL: postgres://spellbook:demo@postgres:5432/spellbook_demo
    volumes:
      - ./backend/workers/state/src:/app/backend/workers/state/src:z
      - ./backend/core/src:/app/backend/core/src:z
    depends_on:
      prepare:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: api
    network_mode: service:frontend
    command: [watchfiles, '--filter', python, spellbook-api, /app/backend/api/src, /app/backend/core/src]
    environment:
      API_HOST: 127.0.0.1
      API_PORT: 3001
      API_TRUSTED_PROXY_ADDRESSES: '127.0.0.1,::1'
      APP_ORIGIN: http://localhost:5173
      DEMO_MODE: 'true'
      DATABASE_URL: postgres://spellbook:demo@postgres:5432/spellbook_demo
      SCAN_STORAGE_DRIVER: local
      SCAN_LOCAL_STORAGE_DIR: /app/storage/scans
      SCAN_WORKER_URL: http://scan-worker:8080
    volumes:
      - ./backend/api/src:/app/backend/api/src:z
      - ./backend/core/src:/app/backend/core/src:z
      - demo_scans:/app/storage/scans
    depends_on:
      prepare:
        condition: service_completed_successfully
      scan-worker:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: web
    command: [pnpm, '--dir', frontend, dev, '--host', 0.0.0.0]
    environment:
      DEV_APP_ORIGIN: http://localhost:5173
      APP_ORIGIN: http://localhost:5173
      DEMO_MODE: 'true'
      API_INTERNAL_URL: http://127.0.0.1:3001
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./frontend/src:/app/frontend/src:z
      - ./frontend/static:/app/frontend/static:z
      - ./contracts/src:/app/contracts/src:z

volumes:
  demo_postgres:
  demo_scans:
