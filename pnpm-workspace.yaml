packages:
  - frontend
  - contracts

# Exact releases reviewed during the stack update, exempted from pnpm release-age delays.
minimumReleaseAgeExclude:
  - bits-ui@2.19.5
# Vite needs esbuild to install its platform binary.
allowBuilds:
  esbuild: true

# Bits UI uses runed's framework-independent entry point, not the optional runed/kit integration.
peerDependencyRules:
  allowedVersions:
    'runed>@sveltejs/kit': 3.1.0
