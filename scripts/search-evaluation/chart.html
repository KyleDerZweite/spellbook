<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Suchvergleich</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				background: transparent;
			}
			#search-results {
				color: var(--foreground);
				font-family: var(--font-sans);
			}
			#search-results .plots {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 14px;
			}
			#search-results svg {
				display: block;
				width: 100%;
				height: 360px;
			}
			#search-results text {
				fill: var(--foreground);
				font-size: 12px;
			}
			#search-results .caption {
				color: var(--muted-foreground);
				font-size: 12px;
				margin: 8px 0 18px;
			}
			#search-results .metric {
				margin: 0;
				font-weight: 500;
			}
			@media (max-width: 650px) {
				#search-results .plots {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<div id="search-results">
			<p class="caption">
				34.948 Karten · 51 Suchfälle · fünf gemessene Durchläufe je Variante und Suchfall
			</p>
			<div class="plots">
				<div>
					<p class="metric">Namenssuche</p>
					<svg
						id="names"
						role="img"
						aria-label="Bekannte richtige Karte unter den ersten fünf Treffern, 26 Namenssuchfälle"
					></svg>
				</div>
				<div>
					<p class="metric">Inhaltssuche</p>
					<svg
						id="content"
						role="img"
						aria-label="Als direkt relevant bewertete Ergebnisse, 70 Trefferplätze aus 14 inhaltlichen Suchfällen. Unabhängige Agentenbewertung."
					></svg>
				</div>
				<div>
					<p class="metric">Warme Backendzeit</p>
					<svg
						id="latency"
						role="img"
						aria-label="95. Perzentil in Millisekunden. Ohne neue Query-Embeddings, Netzwerk und UI-Debounce."
					></svg>
				</div>
			</div>
			<p class="caption">
				Inhalte: blinde Agentenbewertung, keine Humanstudie. Zeiten: Backend ohne Query-Embedding,
				Netzwerk und 150-ms-Debounce.
			</p>
		</div>
		<script>
			const data = __DATA__;
			const labels = {
				baseline: 'Aktuell',
				lexical: 'Lexikalisch',
				'lexical-scan': 'Lexikalisch, Scan',
				bm25: 'BM25',
				vector: 'Vektor, exakt',
				hybrid: 'Hybrid, exakt',
				'vector-ann': 'Vektor, HNSW',
				'hybrid-ann': 'Hybrid, HNSW'
			};
			const root = document.getElementById('search-results');
			function element(tag, attributes, text) {
				const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
				for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
				if (text !== undefined) node.textContent = text;
				return node;
			}
			function draw(id, max, color, unit) {
				const svg = root.querySelector('#' + id),
					width = svg.getBoundingClientRect().width;
				svg.replaceChildren();
				svg.setAttribute('viewBox', `0 0 ${width} 360`);
				const left = 104,
					right = 39,
					top = 35,
					bottom = 312,
					span = Math.max(20, width - left - right);
				const end = left + span;
				for (const value of [0, max / 2, max]) {
					const x = left + (span * value) / max;
					svg.append(
						element('line', {
							x1: x,
							x2: x,
							y1: top - 9,
							y2: bottom,
							stroke: 'var(--border)',
							'stroke-width': 1
						})
					);
					svg.append(
						element(
							'text',
							{ x, y: bottom + 19, 'text-anchor': 'middle' },
							Number.isInteger(value) ? value : Math.round(value)
						)
					);
				}
				data.forEach((row, index) => {
					const y = top + index * 33,
						value = row[id],
						bar = (span * value) / max;
					svg.append(
						element('text', { x: left - 7, y: y + 14, 'text-anchor': 'end' }, labels[row.id])
					);
					svg.append(element('rect', { x: left, y, width: bar, height: 20, fill: color }));
					svg.append(
						element(
							'text',
							{ x: Math.min(end + 5, left + bar + 5), y: y + 14 },
							id === 'latency' ? Math.round(value) : value
						)
					);
				});
				svg.append(
					element('text', { x: left + span / 2, y: bottom + 42, 'text-anchor': 'middle' }, unit)
				);
			}
			function redraw() {
				draw('names', 26, 'var(--chart-1)', 'Treffer / 26');
				draw('content', 70, 'var(--chart-2)', 'Relevante Plätze / 70');
				draw(
					'latency',
					Math.ceil((Math.max(...data.map((row) => row.latency)) * 1.05) / 100) * 100,
					'var(--chart-3)',
					'P95 in ms'
				);
			}
			new ResizeObserver(redraw).observe(root);
			redraw();
		</script>
	</body>
</html>
