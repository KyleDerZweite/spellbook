# Keep persistent state on named volumes for cross-runtime compatibility.
# This avoids most SELinux relabel issues on Fedora while remaining portable to Ubuntu.
services:
  postgres:
    image: docker.io/postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spellbook}
      POSTGRES_USER: ${POSTGRES_USER:-spellbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-spellbook} -d ${POSTGRES_DB:-spellbook}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  db-migrate:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spellbook}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-spellbook}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.39.0
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped

  qdrant:
    image: docker.io/qdrant/qdrant:v1.15.4
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    environment:
      MEILISEARCH_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      AGGRESSIVE_PRELOAD: ${AGGRESSIVE_PRELOAD:-true}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-daily}
      LANGUAGES: ${LANGUAGES:-en}
      WORKER_DATA_DIR: /app/data
    volumes:
      - worker_data:/app/data
    depends_on:
      - meilisearch
    restart: unless-stopped

  scan-worker:
    build:
      context: ./scan-worker
    environment:
      SCAN_STORAGE_DRIVER: ${SCAN_STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-spellbook-scans}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spellbook}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-spellbook}
      PUBLIC_MEILISEARCH_URL: ${PUBLIC_MEILISEARCH_URL}
      MEILISEARCH_INTERNAL_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_MOBILE_CLIENT_ID: ${OIDC_MOBILE_CLIENT_ID}
      APP_ORIGIN: ${APP_ORIGIN}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      SCAN_STORAGE_DRIVER: ${SCAN_STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-spellbook-scans}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SCAN_WORKER_URL: http://scan-worker:8080
    depends_on:
      - db-migrate
      - meilisearch
      - scan-worker
    restart: unless-stopped

  newt:
    image: docker.io/fosrl/newt:latest
    container_name: spellbook-newt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT}
      NEWT_ID: ${NEWT_ID}
      NEWT_SECRET: ${NEWT_SECRET}
    depends_on:
      - frontend

volumes:
  postgres_data:
  meilisearch_data:
  qdrant_data:
  worker_data:
