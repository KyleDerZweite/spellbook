# Keep persistent state on named volumes for cross-runtime compatibility.
# This avoids most SELinux relabel issues on Fedora while remaining portable to Ubuntu.
services:
  postgres:
    image: docker.io/postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spellbook}
      POSTGRES_USER: ${POSTGRES_USER:-spellbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-spellbook} -d ${POSTGRES_DB:-spellbook}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  db-migrate:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_ORIGIN: ${APP_ORIGIN}
      target: migrator
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spellbook}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-spellbook}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spellbook}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-spellbook}
      CATALOG_SOURCE: ${CATALOG_SOURCE:-all_cards}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-daily}
      WORKER_DATA_DIR: /app/data
    volumes:
      - worker_data:/app/data
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scan-worker:
    build:
      context: ./scan-worker
    environment:
      SCAN_STORAGE_DRIVER: ${SCAN_STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-spellbook-scans}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_ORIGIN: ${APP_ORIGIN}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spellbook}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-spellbook}
      APP_ORIGIN: ${APP_ORIGIN}
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
      XFF_DEPTH: ${XFF_DEPTH:-1}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-12M}
      SCAN_STORAGE_DRIVER: ${SCAN_STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-spellbook-scans}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SCAN_WORKER_URL: http://scan-worker:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      scan-worker:
        condition: service_started
    restart: unless-stopped

  newt:
    image: docker.io/fosrl/newt:1.18.1
    profiles: [tunnel]
    container_name: spellbook-newt
    restart: unless-stopped
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT}
      NEWT_ID: ${NEWT_ID}
      NEWT_SECRET: ${NEWT_SECRET}
    depends_on:
      - frontend

volumes:
  postgres18_data:
  worker_data:
